run: docker compose up --build
seed: docker compose exec api node seed.js
base_url: http://localhost:3000

# Created by the seed step (local demo data only):
#   owner header:    X-API-Key: lck_demo_local_only_key
#   demo widget id:  1   (has a honeypot field named "website")
#   allowed origins: http://localhost:5500, http://127.0.0.1:5500
#   second-origin test page: customer-site/index.html  (npx serve -p 5500)

endpoints:
  - GET /health
  - GET /widget.js
  - GET /widgets/1/config
  - POST /submissions
  - GET /widgets
  - GET /dashboard/stats
  - GET /dashboard/submissions