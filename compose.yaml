services:
  api:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/widgets
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: widgets
    volumes: [widgetdata:/var/lib/postgresql/data]
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/widgets
    depends_on: [db]
    command: node worker.js

volumes:
  widgetdata: